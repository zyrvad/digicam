<style>
/* Layout: a one-screen workbench. The model fills the stage; the build manual sits beside it
   (below on phones), one step at a time, like the printed sheet in a camera kit. */
:root {
  --bg: #e7e7e9;            /* cool bench grey, a shade toward the camera's graphite */
  --panel: #f8f8f9;
  --ink: #1d1c1f;
  --muted: #615f66;
  --line: #d4d3d8;
  --accent: #8b4a28;        /* the leather */
  --accent-ink: #ffffff;
  --chrome: #b9b7b0;        /* the top plate */
  --chip: #e2e1e5;
  --label-bg: rgba(29, 28, 31, .88);
  --label-ink: #ffffff;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131315; --panel: #1b1b1e; --ink: #ebeaee; --muted: #a29fa8; --line: #2e2d33;
    --accent: #cf8a5c; --accent-ink: #1b120c; --chrome: #8e8c86; --chip: #26252a;
    --label-bg: rgba(246, 245, 248, .92); --label-ink: #1d1c1f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131315; --panel: #1b1b1e; --ink: #ebeaee; --muted: #a29fa8; --line: #2e2d33;
  --accent: #cf8a5c; --accent-ink: #1b120c; --chrome: #8e8c86; --chip: #26252a;
  --label-bg: rgba(246, 245, 248, .92); --label-ink: #1d1c1f; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 420px; }
.stage { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#gl { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
#labels { position: absolute; inset: 0; pointer-events: none; }
.tag { position: relative; font: 600 11.5px/1.25 var(--body); letter-spacing: .01em; color: var(--label-ink); background: var(--label-bg);
  padding: 4px 8px; border-radius: 3px; white-space: nowrap; transform: translateY(calc(-50% - 22px)); }
.tag::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1.5px; height: 18px; margin-left: -1px; background: var(--label-bg); }
.topbar { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 14px; display: flex; gap: 8px; align-items: center; }
.badge { font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.hud { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: 16px; bottom: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
.hud > *, .topbar > * { pointer-events: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.seg button { font: 600 12px var(--body); color: var(--muted); background: none; border: 0; padding: 7px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { color: var(--ink); background: var(--chip); }
.explode { display: inline-flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 11px; font: 600 12px var(--body); color: var(--muted); }
.explode input { width: 110px; accent-color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); margin-left: auto; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font: 600 13px var(--mono); color: var(--muted); }

.panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
  padding-right: env(safe-area-inset-right, 0px); }
.head { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.eyebrow { font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.head h1 { margin: 0; font: 800 26px/1.1 var(--display); font-stretch: 112%; letter-spacing: -.01em; text-wrap: balance; }
.body { padding: 16px 22px; overflow-y: auto; flex: 1; min-height: 0; display: grid; align-content: start; gap: 14px; }
.body ol { margin: 0; padding-left: 20px; display: grid; gap: 8px; }
.body li::marker { font: 600 12px var(--mono); color: var(--accent); }
.body p { margin: 0; }
.note { font-size: 13.5px; color: var(--muted); border-left: 2px solid var(--chrome); padding-left: 10px; }
.warn { font-size: 13.5px; border-left: 2px solid var(--accent); padding-left: 10px; }
.kit { display: flex; flex-wrap: wrap; gap: 6px; }
.wirenav { display: flex; align-items: center; gap: 8px; }
.wirenav span { font: 600 12px var(--mono); color: var(--muted); flex: 1; text-align: center; font-variant-numeric: tabular-nums; }
.wirecard { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; }
.wirecard h2 { margin: 0; font: 700 16px/1.3 var(--body); display: flex; align-items: center; gap: 8px; }
.wirecard h2 i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.wirecard dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13.5px; }
.wirecard dt { color: var(--muted); } .wirecard dd { margin: 0; }
.wirelist { list-style: none; margin: 0; padding: 0 4px 0 0; display: grid; gap: 2px; max-height: 260px; overflow-y: auto; border-top: 1px solid var(--line); padding-top: 6px; }
.wirelist button { width: 100%; text-align: left; font: 500 13px var(--body); color: var(--ink); background: none; border: 0; border-radius: 4px;
  padding: 5px 8px; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.wirelist button i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.wirelist button span { margin-left: auto; font: 500 11.5px var(--mono); color: var(--muted); }
.wirelist button[aria-current="true"] { background: var(--chip); font-weight: 700; }
.kit span { font: 500 12px var(--mono); background: var(--chip); border-radius: 4px; padding: 3px 8px; display: inline-flex; align-items: center; gap: 6px; }
.kit i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; box-shadow: 0 0 0 1px var(--muted); }
.nav { padding: 12px 22px 16px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.navrow { display: flex; gap: 8px; }
.btn { font: 700 14px var(--body); border-radius: 6px; padding: 10px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); flex: 1; }
.btn:disabled { opacity: .4; cursor: default; }
.btn:focus-visible, .seg button:focus-visible, .dots button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dots { display: flex; flex-wrap: wrap; gap: 5px; }
.dots button { font: 600 11px var(--mono); width: 28px; height: 26px; border-radius: 4px; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums; }
.dots button[aria-current="step"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.pins { width: 100%; border-collapse: collapse; font: 500 12.5px var(--mono); }
.pins td { padding: 3px 6px 3px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.pins td:first-child { color: var(--muted); }
.pins td:last-child { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 52% 48%; }
  .panel { border-left: 0; border-top: 1px solid var(--line); padding-left: env(safe-area-inset-left, 0px); }
  .head { padding: 12px 16px 10px; } .head h1 { font-size: 21px; }
  .body { padding: 12px 16px; } .nav { padding: 10px 16px 12px; }
  .hint { display: none; } .explode input { width: 80px; }
  .hud { left: max(10px, env(safe-area-inset-left, 0px)); right: 10px; bottom: 10px; } .topbar { left: max(10px, env(safe-area-inset-left, 0px)); top: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<script type="module">
import * as THREE from "three";
import { STLLoader } from "three/addons/loaders/STLLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

// ------------------------------------------------------------------ the body (cad/camera1_v4.scad)
// Model X runs left to right seen from the back, Y up, Z back to front.
const B = { W: 128, H: 58, TOP: 68.2, BOT: -5, Z0: 0, Z1: 22.1, D: 20.9, zfi: 18.5, zmid: 10.25 };
const PORTRAIT = { x0: 6.395, y0: 8, w: 46.81, h: 44, z: -1.21 };
const WIRE = { black: "#26232b", red: "#d6393b", blue: "#2f6fd6", tan: "#d8c39a" };
const GREY_SCREW = "#80848c", BRASS = "#c9a24a", BODY = "#74472c", SILVER = "#d8d6d0", LEATHER = "#7a4a2e";

// colour, roughness, metalness, opacity, emissive, pull-apart offset, wire flag
const P = {
  frame:          { c: BODY, r: .55, ex: [0, 0, 0] },
  inserts:        { c: BRASS, r: .3, m: .9, ex: [0, 0, 0] },
  back_plate:     { c: BODY, r: .5, ex: [0, 0, -46] },
  screws_back:    { c: GREY_SCREW, r: .35, m: .8, ex: [0, 0, -64] },
  caps:           { c: SILVER, r: .4, m: .3, ex: [0, 0, -58] },
  carrier:        { c: "#8d8b93", r: .5, ex: [0, 0, -30] },
  buttons:        { c: "#2b2a30", r: .5, ex: [0, 0, -30] },
  screws_carrier: { c: GREY_SCREW, r: .35, m: .8, ex: [0, 0, -22] },
  screen_glass:   { c: "#121219", r: .2, ex: [0, 0, -18] },
  screen_active:  { c: "#6a5fb0", r: .25, e: "#3a2f7a", ex: [0, 0, -18] },
  screen_pcb:     { c: "#2a4a9b", r: .6, ex: [0, 0, -18] },
  screen_pads:    { c: "#d9ad4f", r: .3, m: .8, ex: [0, 0, -18] },
  screen_pad:     { c: "#e9e3ec", r: .9, ex: [0, 0, -10] },
  battery:        { c: "#cdc6b4", r: .35, m: .5, ex: [0, 0, 14] },
  foam:           { c: "#e9e3ec", r: .9, ex: [0, 0, 8] },
  deck:           { c: "#dcd7ce", r: .7, ex: [0, 0, 20] },
  screws_deck:    { c: GREY_SCREW, r: .35, m: .8, ex: [0, 0, 26] },
  board_pcb:      { c: "#1f5a44", r: .6, ex: [0, 0, 32] },
  board_pads:     { c: "#d9ad4f", r: .3, m: .8, ex: [0, 0, 32] },
  board_module:   { c: "#b9bdc6", r: .3, m: .75, ex: [0, 0, 32] },
  board_parts:    { c: "#9ea2ab", r: .35, m: .6, ex: [0, 0, 32] },
  screws_board:   { c: GREY_SCREW, r: .35, m: .8, ex: [0, 0, 40] },
  camera_tape:    { c: "#e9e3ec", r: .9, ex: [0, 0, 38] },
  camera:         { c: "#24232a", r: .5, ex: [0, 0, 44] },
  camera_glass:   { c: "#6d8fb3", r: .15, m: .3, ex: [0, 0, 44] },
  ribbon:         { c: "#c47a22", r: .4, ex: [0, 0, 40] },
  cradle:         { c: "#c4beb2", r: .7, ex: [0, 0, 24] },
  charger_pcb:    { c: "#2f62c9", r: .6, ex: [0, 0, 30] },
  charger_parts:  { c: "#b9bdc6", r: .35, m: .7, ex: [0, 0, 30] },
  resistors:      { c: WIRE.tan, r: .6, ex: [0, 0, 30] },
  shutter_sw:     { c: "#2b2a30", r: .5, ex: [0, 22, 0] },
  slide_sw:       { c: "#2b2a30", r: .5, ex: [0, 22, 0] },
  shutter_cap:    { c: SILVER, r: .4, m: .3, ex: [0, 42, 0] },
  knob:           { c: SILVER, r: .4, m: .3, ex: [0, 42, 0] },
  top_plate:      { c: SILVER, r: .35, m: .35, ex: [0, 30, 0] },
  top_bits:       { c: SILVER, r: .4, m: .3, ex: [0, 38, 0] },
  windows:        { c: "#141317", r: .15, ex: [0, 26, 0] },
  bottom_plate:   { c: SILVER, r: .35, m: .35, ex: [0, -30, 0] },
  screws_bottom:  { c: GREY_SCREW, r: .35, m: .8, ex: [0, -46, 0] },
  screws_top:     { c: GREY_SCREW, r: .35, m: .8, ex: [0, 48, 0] },
  front_plate:    { c: BODY, r: .5, ex: [0, 0, 52] },
  screws_front:   { c: GREY_SCREW, r: .35, m: .8, ex: [0, 0, 66] },
  lens_barrel:    { c: SILVER, r: .3, m: .45, ex: [0, 0, 74] },
  inserts_barrel: { c: BRASS, r: .3, m: .9, ex: [0, 0, 74] },
  screws_barrel:  { c: GREY_SCREW, r: .35, m: .8, ex: [0, 0, 60] },
  covering_front: { c: LEATHER, r: .85, ex: [0, 0, 86] },
  covering_back:  { c: LEATHER, r: .85, ex: [0, 0, -78] },
  w_bat_red:  { c: WIRE.red, r: .5, wire: 1 }, w_bat_black: { c: WIRE.black, r: .5, wire: 1 },
  w_out_plus: { c: WIRE.red, r: .5, wire: 1 }, w_5v: { c: WIRE.red, r: .5, wire: 1 },
  w_gnd:      { c: WIRE.black, r: .5, wire: 1 }, w_sense: { c: WIRE.blue, r: .5, wire: 1 },
  w_btn_left: { c: WIRE.blue, r: .5, wire: 1 }, w_btn_ok: { c: WIRE.blue, r: .5, wire: 1 }, w_btn_right: { c: WIRE.blue, r: .5, wire: 1 },
  w_shutter:  { c: WIRE.blue, r: .5, wire: 1 },
  w_bgnd_chain: { c: WIRE.black, r: .5, wire: 1 }, w_bgnd_shutter: { c: WIRE.black, r: .5, wire: 1 }, w_bgnd_board: { c: WIRE.black, r: .5, wire: 1 },
};
// screen wires, bottom to top at the screen's pins: BLK CS DC RES SDA SCL VCC GND
for (let i = 0; i < 8; i++) P["w_screen_" + i] = { c: i === 6 ? WIRE.red : i === 7 ? WIRE.black : WIRE.blue, r: .5, wire: 1 };

// ------------------------------------------------------------------ the steps
const kit = (...items) => `<div class="kit">${items.map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join("")}</div>`;
const pins = rows => `<table class="pins">${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
const ALL = Object.keys(P);
const WIRES = ALL.filter(k => P[k].wire);
const SCREENW = Array.from({ length: 8 }, (_, i) => "w_screen_" + i);
const ELEC = ["battery", "screen_glass", "screen_active", "screen_pcb", "screen_pads", "board_pcb", "board_pads", "board_module", "board_parts",
              "camera", "camera_glass", "camera_tape", "ribbon", "charger_pcb", "charger_parts", "resistors", "buttons", "shutter_sw", "slide_sw"];
const FRAME = ["frame", "inserts"];
const BTN = ["caps", "buttons", "carrier", "screws_carrier"];
const SCREEN = ["screen_glass", "screen_active", "screen_pcb", "screen_pads", "screen_pad"];
const BOARD = ["board_pcb", "board_pads", "board_module", "board_parts", "camera_tape", "camera", "camera_glass", "ribbon", "screws_board"];
const POWER = ["cradle", "charger_pcb", "charger_parts", "resistors", "w_bat_red", "w_bat_black", "w_gnd", "w_sense"];
const TOP = ["shutter_sw", "slide_sw", "shutter_cap", "knob", "top_plate", "top_bits", "windows", "screws_top", "w_out_plus", "w_5v", "w_shutter", "w_bgnd_shutter"];
const FRONT = ["front_plate", "screws_front", "lens_barrel", "inserts_barrel", "screws_barrel"];
const s4 = ["back_plate", ...BTN];
const s5 = [...s4, ...SCREEN];
const s6 = [...s5, ...FRAME, "screws_back"];
const s7 = [...s6, "battery", "foam"];
const s8 = [...s7, "deck", "screws_deck", ...SCREENW];
const s9 = [...s8, "w_btn_left", "w_btn_ok", "w_btn_right", "w_bgnd_chain", "w_bgnd_board"];
const s10 = [...s9, ...BOARD];
const s11 = [...s10, ...POWER];
const s12 = [...s11, ...FRONT];
const s13 = [...s12, ...TOP];
const s13b = [...s13, "bottom_plate", "screws_bottom"];
const s14 = [...s13b, "covering_front", "covering_back"];
const lift = (list, d) => Object.fromEntries(list.map(k => [k, d]));
const NOT_CASE = ["frame", "inserts", "screws_back"];

const STEPS = [
  { title: "All the parts", view: "side", explode: 1, show: ALL.filter(k => !P[k].wire),
    text: `<p>The retro body rebuilt around the parts as measured, dressed like a Leica M6 in brown and in its proportions: a brown body (frame between two plates, leather front, back and ends), a silver cover that comes a third of the way down the front and the ends, and a silver bottom plate. It's a left-handed M6: the shutter, speed dial and advance lever are on the left as you hold it, the knob on the right. Inside, a wiring deck over the screen and a power cradle on the battery.</p>
      <p>Pull the slider to take it apart. The steps follow <b>13-assembly-guide-v4.md</b>: solder and test everything on the desk, then build up from the back plate.</p>
      ${kit([BODY, "frame, plates"], [LEATHER, "coverings"], [SILVER, "top cover, bottom plate, lens, controls"], ["#dcd7ce", "wiring deck"], ["#c4beb2", "power cradle"], ["#8d8b93", "button carrier"])}
      <p class="note">The deck, cradle and carrier print in brown on the test-first plate (they're hidden); they're shown lighter here so you can tell them apart.</p>` },
  { title: "Press in the inserts", view: "front3q", show: [...FRAME, "lens_barrel", "inserts_barrel"], hide: [], enter: { inserts: [0, 0, 14], inserts_barrel: [0, 0, 12] },
    labels: { inserts: ["8 in the posts, 2 + 2 for the deck and board, 2 under the top, 2 in the bottom", [5.8, 5.8, 18.6]], inserts_barrel: "3 in the barrel's back" },
    text: `<ol><li>Spare iron tip at about <b>200 °C</b> (PLA). Let each insert sink in under a light, straight push until it's flush.</li>
      <li>Frame: one in each end of the 4 corner posts (8), one in each of the 2 deck bosses at the bottom and the 2 under the board's holes, 2 under the top wall from the top, and 2 in the bottom wall from below (for the bottom plate).</li>
      <li>Lens barrel: 3 from its back face.</li></ol>
      ${kit([BRASS, "16 + 3 × M2 heat-set insert"])}` },
  { title: "Solder everything on the desk", view: "front3q", show: [...ELEC, ...WIRES], ghost: [], hideCase: true,
    labels: { w_screen_4: ["8 screen wires", [55.8, 30, 7]], w_gnd: ["OUT− to GND", [82, 11.2, 8.1]], resistors: "2 × 100k at the module",
              w_out_plus: ["OUT+ along the top to the switch", [64, 48.6, 16.7]] },
    text: `<p>Everything is soldered and tested while it's loose. Lengths are in the guide; cut a little long.</p>
      <p class="warn">Every board wire goes <b>up through its pad from underneath</b> and is soldered on top.</p>

const meshes = {};
for (const name of Object.keys(P)) {
  const data = bundle[name];
  if (!data) { delete P[name]; continue; }
  const geo = loader.parse(unpack(data));
  geo.computeVertexNormals();
  const p = P[name];
  const mat = new THREE.MeshStandardMaterial({ color: p.c, roughness: p.r ?? .5, metalness: p.m ?? 0,
    transparent: p.o != null, opacity: p.o ?? 1, depthWrite: p.o == null,
    emissive: p.e ? new THREE.Color(p.e) : new THREE.Color(0), side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  geo.computeBoundingBox();
  mesh.userData = { base: new THREE.Color(p.c), baseOpacity: p.o ?? 1,
                    top: geo.boundingBox.getCenter(new THREE.Vector3()).setY(geo.boundingBox.max.y) };
  root.add(mesh);
  meshes[name] = mesh;
}

function framing() {
  placeAll(1);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3();
  for (const m of Object.values(meshes)) if (m.visible) box.expandByObject(m);
  if (box.isEmpty()) box.setFromObject(root);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const v = THREE.MathUtils.degToRad(camera.fov) / 2;
  const h = Math.atan(Math.tan(v) * camera.aspect);
  return { centre: sphere.center, dist: sphere.radius / Math.sin(Math.min(v, h)) * 0.98 };
}
function setView(name, instant) {

  const pos = new THREE.Vector3(...VIEWS[name]).normalize().multiplyScalar(f.dist).add(f.centre);
  ["back", "front", "top"].forEach(k => document.getElementById("v-" + k).setAttribute("aria-pressed", String(k === name)));
  if (instant || reduced) { camera.position.copy(pos); controls.target.copy(f.centre); return; }
  camAnim = { from: camera.position.clone(), fromT: controls.target.clone(), to: pos, toT: f.centre.clone(), t0: performance.now(), dur: 900 };
}
function applyVisibility() {
  const s = STEPS[stepIndex];
  for (const [name, mesh] of Object.entries(meshes)) {
    let vis = s.show.includes(name) && !(s.hide || []).includes(name);
    if ((!caseShown || s.hideCase) && CASE.includes(name)) vis = false;
    if (explode > .02 && P[name].wire) vis = false;
    mesh.visible = vis;
  }
}
function placeAll(progress) {
  const s = STEPS[stepIndex];
  const enter = s.enter || {};
  const names = Object.keys(enter);
  for (const [name, mesh] of Object.entries(meshes)) {
    const ex = P[name].ex || [0, 0, 0];
    const pos = new THREE.Vector3(ex[0] * explode, ex[1] * explode, ex[2] * explode);
    const mat = mesh.material;
    const isNew = name in enter;
    let opacity = (s.ghost || []).includes(name) ? .16 : mesh.userData.baseOpacity;
    const sel = s.wires ? WIRE_INFO[wireIndex].k : null;
    if (s.wires) opacity = name === sel ? 1 : P[name].wire ? .07 : .26;
    if (isNew) {
      const i = names.indexOf(name);
      const t = Math.min(1, Math.max(0, (progress * (1 + names.length * .05) - i * .05)));
      pos.add(new THREE.Vector3(...enter[name]).multiplyScalar(1 - ease(t)));
      opacity *= Math.min(1, t * 2.5);
    }
    mesh.position.copy(pos);
    const dim = (!isNew && names.length) ? .4 : 0;   // earlier steps' parts fade back a little
    mat.color.copy(mesh.userData.base).lerp(grey, dim);
    if (s.wires && name === sel) mat.emissive.copy(mesh.userData.base).multiplyScalar(.55);
    else mat.emissive.set(P[name].e || 0);
    mat.opacity = opacity;
    mat.transparent = opacity < 1;
    mat.depthWrite = opacity >= 1;
    for (const c of mesh.children) if (c.material) c.material.opacity = opacity;
  }
}
function addTag(parent, text, at) {
  const el = document.createElement("div");
  const tag = document.createElement("div");
  tag.className = "tag";
  tag.textContent = text;
  el.appendChild(tag);
  const obj = new CSS2DObject(el);
  obj.position.copy(at);
  parent.add(obj);
  labelObjs.push(obj);
}
function setLabels() {
  labelObjs.splice(0).forEach(o => o.parent.remove(o));
  const s = STEPS[stepIndex];
  if (s.wires) {
    const w = WIRE_INFO[wireIndex], ends = bundle._wires?.[w.k], mesh = meshes[w.k];
    if (ends && mesh && mesh.visible) { addTag(mesh, "From: " + w.from, new THREE.Vector3(...ends[0])); addTag(mesh, "To: " + w.to, new THREE.Vector3(...ends[1])); }
    return;
  }
  if (!s.labels || explode > .02) return;
  for (const [name, spec] of Object.entries(s.labels)) {
    const mesh = meshes[name];
    if (!mesh || !mesh.visible) continue;
    const [text, at] = Array.isArray(spec) ? spec : [spec, null];
    const el = document.createElement("div");
    const tag = document.createElement("div");
    tag.className = "tag";
    tag.textContent = text;
    el.appendChild(tag);
    const obj = new CSS2DObject(el);
    obj.position.copy(at ? new THREE.Vector3(...at) : mesh.userData.top);
    mesh.add(obj);
    labelObjs.push(obj);
  }
}
const wireLen = w => w.lenText || (bundle._lengths?.[w.len] ? bundle._lengths[w.len] + " mm" : "");
function wirePanel() {
  const w = WIRE_INFO[wireIndex];
  const dot = k => `<i style="background:${P[k] ? P[k].c : "#888"}"></i>`;
  return `<div class="wirenav"><button class="btn" id="wprev" aria-label="Previous wire">◀ Wire</button>
      <span>${wireIndex + 1} of ${WIRE_INFO.length}</span><button class="btn" id="wnext" aria-label="Next wire">Wire ▶</button></div>
    <div class="wirecard"><h2>${dot(w.k)}${w.from} → ${w.to}</h2>
      <dl><dt>Wire</dt><dd>${w.type}</dd><dt>Cut</dt><dd>${wireLen(w)}</dd></dl><p>${w.how}</p></div>
    <ol class="wirelist">${WIRE_INFO.map((x, i) => `<li><button data-i="${i}" aria-current="${i === wireIndex}">${dot(x.k)}${x.from.replace(/ \(.*\)/, "")} → ${x.to.replace(/ \(.*\)/, "")}<span>${wireLen(x)}</span></button></li>`).join("")}</ol>`;
}
function pickWire(i) {
  wireIndex = (i + WIRE_INFO.length) % WIRE_INFO.length;
  render(); placeAll(1); setLabels(); frameWire();
}
function frameWire(instant) {
  const mesh = meshes[WIRE_INFO[wireIndex].k];
  if (!mesh) return;
  placeAll(1);
  root.updateMatrixWorld(true);
  const sphere = new THREE.Box3().setFromObject(mesh).getBoundingSphere(new THREE.Sphere());
  const v = THREE.MathUtils.degToRad(camera.fov) / 2, h = Math.atan(Math.tan(v) * camera.aspect);
  const dist = Math.max(sphere.radius * 1.5, 30) / Math.sin(Math.min(v, h));
  const pos = new THREE.Vector3(...VIEWS[STEPS[stepIndex].view]).normalize().multiplyScalar(dist).add(sphere.center);
  if (instant || reduced) { camera.position.copy(pos); controls.target.copy(sphere.center); return; }
  camAnim = { from: camera.position.clone(), fromT: controls.target.clone(), to: pos, toT: sphere.center.clone(), t0: performance.now(), dur: 700 };
}
function render() {
  const s = STEPS[stepIndex];
  document.getElementById("count").textContent = `Step ${stepIndex + 1} of ${STEPS.length}`;
  document.getElementById("title").textContent = s.title;
  document.getElementById("text").innerHTML = s.text + (s.wires ? wirePanel() : "");
  if (s.wires) {
    document.getElementById("wprev").addEventListener("click", () => pickWire(wireIndex - 1));
    document.getElementById("wnext").addEventListener("click", () => pickWire(wireIndex + 1));
    document.querySelectorAll(".wirelist button").forEach(b => b.addEventListener("click", () => pickWire(+b.dataset.i)));
    const list = document.querySelector(".wirelist"), cur = list.querySelector("[aria-current=true]");
    list.scrollTop = cur.offsetTop - list.offsetTop - list.clientHeight / 2 + cur.offsetHeight / 2;
    document.getElementById("text").scrollTop = 0;
  }
  if (!s.wires) document.getElementById("text").scrollTop = 0;
  document.getElementById("prev").disabled = stepIndex === 0;
  document.getElementById("next").textContent = stepIndex === STEPS.length - 1 ? "Start again" : "Next step";
  [...dots.children].forEach((b, i) => b.setAttribute("aria-current", i === stepIndex ? "step" : "false"));
}
function goTo(i, opts = {}) {
  stepIndex = (i + STEPS.length) % STEPS.length;
  const s = STEPS[stepIndex];
  explode = s.explode ?? 0;
  document.getElementById("ex").value = explode;
  controls.autoRotate = !!s.spin && !reduced;
  controls.autoRotateSpeed = 1.2;
  applyVisibility();
  render();
  if (s.wires) frameWire(opts.instant); else setView(s.view, opts.instant);
  anim = (reduced || opts.instant) ? null : { t0: performance.now(), dur: 1300 };
  placeAll(anim ? 0 : 1);
  setLabels();
  try { history.replaceState(null, "", `#step${stepIndex + 1}`); } catch (e) {}
}

// ------------------------------------------------------------------ controls
document.getElementById("next").addEventListener("click", () => goTo(stepIndex + 1));
document.getElementById("prev").addEventListener("click", () => goTo(stepIndex - 1));
document.getElementById("replay").addEventListener("click", () => goTo(stepIndex));
for (const v of ["back", "front", "top"]) document.getElementById("v-" + v).addEventListener("click", () => { controls.autoRotate = false; setView(v); });
document.getElementById("t-case").addEventListener("click", e => {
  caseShown = !caseShown;
  e.currentTarget.setAttribute("aria-pressed", String(caseShown));
  e.currentTarget.textContent = caseShown ? "Case shown" : "Case hidden";
  applyVisibility(); setLabels();
});
document.getElementById("ex").addEventListener("input", e => {
  explode = +e.target.value; anim = null; applyVisibility(); placeAll(1); setLabels();
});
addEventListener("hashchange", () => {
  const m = location.hash.match(/^#step(\d+)$/);
  if (m && +m[1] - 1 !== stepIndex) goTo(+m[1] - 1);
});
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") goTo(stepIndex + 1);
  if (e.key === "ArrowLeft") goTo(stepIndex - 1);
  if (STEPS[stepIndex].wires && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); pickWire(wireIndex + (e.key === "ArrowDown" ? 1 : -1)); }
});

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false);
  labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
resize();

function tick(now) {
  if (anim) {
    const t = Math.min(1, (now - anim.t0) / anim.dur);
    placeAll(t);
    if (t >= 1) { anim = null; placeAll(1); }
  }
  if (camAnim) {
    const t = ease(Math.min(1, (now - camAnim.t0) / camAnim.dur));
    camera.position.lerpVectors(camAnim.from, camAnim.to, t);
    controls.target.lerpVectors(camAnim.fromT, camAnim.toT, t);
    if (t >= 1) camAnim = null;
  }
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(tick);
}
const m0 = location.hash.match(/^#step(\d+)$/);
goTo(m0 ? Math.min(Math.max(+m0[1] - 1, 0), STEPS.length - 1) : 0, { instant: true });
requestAnimationFrame(tick);
window.__ready = true;
</script>
